<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Background Gradient: Deep Obsidian Navy -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071126" />
      <stop offset="50%" stop-color="#0b1a38" />
      <stop offset="100%" stop-color="#050b18" />
    </linearGradient>

    <!-- Blue Ring Metallic Bezel -->
    <linearGradient id="ringBezelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#0284c7" />
      <stop offset="85%" stop-color="#0052cc" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <!-- Inner Aperture Depth -->
    <radialGradient id="apertureDepth" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0f274a" />
      <stop offset="65%" stop-color="#081426" />
      <stop offset="100%" stop-color="#040914" />
    </radialGradient>

    <!-- 3D Gold Bars Gradient -->
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="25%" stop-color="#fbbf24" />
      <stop offset="80%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Gold Bar Top Bevel -->
    <linearGradient id="barCapGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0.6" />
    </linearGradient>

    <!-- Neon Green Growth Arrow -->
    <linearGradient id="growthGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="60%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>

    <!-- 3D Gold Coin Gradients -->
    <linearGradient id="coinRimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="45%" stop-color="#f59e0b" />
      <stop offset="85%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <linearGradient id="coinFaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Filter Shadows -->
    <filter id="ringShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0284c7" flood-opacity="0.35" />
    </filter>

    <filter id="arrowGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#22c55e" flood-opacity="0.55" />
    </filter>

    <filter id="coinShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.55" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#d97706" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- 1. Squircle Base with Soft Outer Highlight -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2.5" />

  <!-- 2. Main 3D Blue Ring / Bezel (Centered slightly up-left to balance the bottom-right coin) -->
  <g filter="url(#ringShadow)">
    <!-- Outer Bezel Ring -->
    <circle cx="236" cy="236" r="162" fill="url(#ringBezelGrad)" />
    <!-- Inner Dark Aperture -->
    <circle cx="236" cy="236" r="128" fill="url(#apertureDepth)" stroke="rgba(0, 0, 0, 0.4)" stroke-width="3" />
    
    <!-- Specular White Rim Reflection (Top-Left) -->
    <path d="M 124 162 A 162 162 0 0 1 290 82" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round" opacity="0.85" filter="drop-shadow(0 0 6px #ffffff)" />
    <path d="M 116 220 A 162 162 0 0 1 180 110" stroke="#bae6fd" stroke-width="3" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- 3. Rising 3D Golden Bar Charts Inside Ring -->
  <g id="barsGroup">
    <!-- Bar 1 (Shortest) -->
    <g>
      <rect x="144" y="275" width="34" height="75" rx="8" fill="url(#barGrad)" />
      <rect x="144" y="275" width="34" height="10" rx="5" fill="url(#barCapGrad)" />
    </g>
    <!-- Bar 2 -->
    <g>
      <rect x="190" y="225" width="34" height="125" rx="8" fill="url(#barGrad)" />
      <rect x="190" y="225" width="34" height="10" rx="5" fill="url(#barCapGrad)" />
    </g>
    <!-- Bar 3 -->
    <g>
      <rect x="236" y="180" width="34" height="170" rx="8" fill="url(#barGrad)" />
      <rect x="236" y="180" width="34" height="10" rx="5" fill="url(#barCapGrad)" />
    </g>
    <!-- Bar 4 (Tallest) -->
    <g>
      <rect x="282" y="132" width="34" height="218" rx="8" fill="url(#barGrad)" />
      <rect x="282" y="132" width="34" height="10" rx="5" fill="url(#barCapGrad)" />
    </g>
  </g>

  <!-- 4. Vibrant Green Upward Growth Trendline with Arrow Head -->
  <g filter="url(#arrowGlow)">
    <!-- Zigzag Path -->
    <path
      d="M 134 278 L 188 214 L 234 246 L 314 134"
      stroke="url(#growthGrad)"
      stroke-width="16"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Specular Highlight Curve on Green Line -->
    <path
      d="M 134 276 L 188 212 L 234 244 L 314 132"
      stroke="#ffffff"
      stroke-width="4.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.65"
    />
    <!-- Arrow Head at Top Right -->
    <path
      d="M 290 120 L 334 116 L 328 160 Z"
      fill="#22c55e"
      stroke="#4ade80"
      stroke-width="3"
      stroke-linejoin="round"
    />
    <path
      d="M 296 123 L 330 119 L 325 152 Z"
      fill="#4ade80"
    />
  </g>

  <!-- 5. 3D Shiny Gold Currency Coin in Bottom Right Foreground -->
  <g filter="url(#coinShadow)">
    <!-- Outer Gold Coin Rim -->
    <circle cx="362" cy="362" r="76" fill="url(#coinRimGrad)" stroke="#fef08a" stroke-width="2.5" />
    
    <!-- Coin Inner Inset -->
    <circle cx="362" cy="362" r="62" fill="url(#coinFaceGrad)" />
    
    <!-- Inner Beaded / Dashed Ring -->
    <circle cx="362" cy="362" r="52" fill="none" stroke="#fef3c7" stroke-width="2" stroke-dasharray="6 4" opacity="0.8" />
    
    <!-- Currency Symbol in Center (Both Dollar/Rupee Aesthetic - Sharp Bold Emblem) -->
    <text
      x="362"
      y="384"
      text-anchor="middle"
      fill="#ffffff"
      font-size="64"
      font-weight="900"
      font-family="system-ui, -apple-system, sans-serif"
      filter="drop-shadow(0 2px 4px rgba(180, 83, 9, 0.6))"
    >₹</text>

    <!-- Top Left Coin Specular Light Sparkle -->
    <path
      d="M 314 340 A 62 62 0 0 1 356 304"
      stroke="#ffffff"
      stroke-width="5"
      stroke-linecap="round"
      opacity="0.85"
    />
    <circle cx="320" cy="334" r="3" fill="#ffffff" filter="drop-shadow(0 0 4px #ffffff)" />
  </g>

  <!-- Subtle Ambient Glow in bottom center -->
  <ellipse cx="256" cy="460" rx="140" ry="16" fill="rgba(2, 132, 199, 0.25)" filter="blur(16px)" />
</svg>